[package]
name = "op-revm"
description = "Optimism variant of Revm"
version = "20.0.0"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
# revm
revm = { workspace = true, features = ["serde"] }
auto_impl.workspace = true
alloy-sol-types.workspace = true

# Optional
serde = { workspace = true, features = ["derive", "rc"], optional = true }

[dev-dependencies]
# op-alloy
# `[MANTLE]` test-only: the `#[cfg(test)]` `catch_error_tests` matrix needs `OpTxType` (for the
# SDM `PostExec` arm). Neither upstream op-revm 20.0.0 nor Mantle's shipped
# `v107-mantle-arsia.1` declares this crate at all, so keeping it out of `[dependencies]`
# matches both. Same treatment as sha2 / serde_json / alloy-primitives below, which are
# likewise dev-only yet referenced from the `std` feature list.
op-alloy-consensus = { workspace = true }
rstest.workspace = true
alloy-sol-types.workspace = true
anyhow.workspace = true
sha2.workspace = true
serde_json = { workspace = true, features = ["alloc", "preserve_order"] }
serde = { workspace = true, features = ["derive"] }
alloy-primitives.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process"] }
tempfile = "3.10"

[features]
default = ["std", "c-kzg", "secp256k1", "portable", "blst"]
std = [
	"serde?/std",
	"revm/std",
	"op-alloy-consensus/std",
	"alloy-sol-types/std",
	"sha2/std",
	"serde_json/std",
	"alloy-primitives/std",
]
serde = ["dep:serde", "revm/serde", "alloy-primitives/serde", "op-alloy-consensus/serde"]
portable = ["revm/portable"]

dev = [
	"revm/dev",
	"memory_limit",
	"optional_balance_check",
	"optional_block_gas_limit",
	"optional_eip3541",
	"optional_eip3607",
	"optional_no_base_fee",
]
memory_limit = ["revm/memory_limit"]
optional_balance_check = ["revm/optional_balance_check"]
optional_block_gas_limit = ["revm/optional_block_gas_limit"]
optional_eip3541 = ["revm/optional_eip3541"]
optional_eip3607 = ["revm/optional_eip3607"]
optional_no_base_fee = ["revm/optional_no_base_fee"]
optional_fee_charge = ["revm/optional_fee_charge"]

# See comments in `revm-precompile`
secp256k1 = ["revm/secp256k1"]
c-kzg = ["revm/c-kzg"]
blst = ["revm/blst"]
bn = ["revm/bn"]
