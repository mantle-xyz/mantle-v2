# Configuration file for acceptance tests (op-acceptor)
#
# All acceptance tests need to be registered here for op-acceptor to run them.
# As a rule of thumb, we recommend that each fork gate inherits from the
# base gate as well as any earlier fork gates.

gates:
  # New tests should be added here first with an owner metadata.
  # Once we're confident they're not flaky, a PR will be automatically created to remove them from this gate.
  # Example entry format:
  # - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/parallelism
  #   timeout: 10m
  #   metadata:
  #     owner: "team-infra"
  - id: flake-shake
    description: "Quarantine gate for new and potentially flaky tests requiring stability validation."
    tests:
  - id: isthmus
    description: "Isthmus network tests."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/isthmus
        timeout: 6h
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/isthmus/operator_fee
        timeout: 6h
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/isthmus/withdrawal_root
        timeout: 20m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/isthmus/erc20_bridge
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/isthmus/pectra
        timeout: 10m

  - id: base
    description: "Sanity/smoke acceptance tests for all networks."
    inherits:
      - isthmus
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/base
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/base/deposit
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/base/chain
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/ecotone
        timeout: 10m
      # TODO(infra#401): Re-enable the test when the sysext missing toolset is implemented
      #- package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/base/withdrawal
      #  timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/fjord

  - id: conductor
    description: "Sanity/smoke acceptance tests for networks with conductors."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/base/conductor
        timeout: 10m

  - id: pre-interop
    inherits:
      - base
    description: "Pre-interop network tests."
    tests:
      - name: TestInteropReadiness
        package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/isthmus/preinterop
        timeout: 20m

  - id: interop
    inherits:
      - base
    description: "Interop network tests."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/interop
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/interop/message
        timeout: 30m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/interop/sync
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/interop/smoke
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/interop/contract

  - id: interop-loadtest
    description: "Interop network loadtests."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/interop/loadtest
        timeout: 10m

  - id: flashblocks
    inherits:
      - base
    description: "Flashblocks network tests."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/flashblocks
        timeout: 5m

  - id: flashblocks-with-isthmus
    inherits:
      - base
    description: "Flashblocks network tests with Isthmus."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/flashblocks
        timeout: 5m

  - id: sync-test-op-node
    description: "Sync tests for op-node with external networks via the op-sync-tester - tests run daily."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/sync_tester/sync_tester_ext_el
        timeout: 30m

  - id: jovian
    inherits:
      - base
    description: "Jovian network tests."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/jovian/...
        timeout: 10m

  - id: cgt
    description: "Custom Gas Token (CGT) network tests."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/tests/custom_gas_token
        timeout: 10m

  - id: mantle-arsia
    description: "Mantle Arsia network tests."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/arsia/...
        timeout: 20m

  - id: mantle-base
    inherits:
      - mantle-arsia
    description: "Sanity/smoke acceptance tests for Mantle network."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/base
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/base/deposit
        timeout: 20m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/base/chain
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/base/withdrawal
        timeout: 20m

  # One gate, deliberately. Splitting a PR-only subset out of it was tried and
  # reverted: it moved the reorg suites off the PR path, and those are the highest-value
  # cases here (the fakepos rebuild-divergence bug lived in exactly that coverage). It also
  # left no mechanism to decide which gate a NEW package belongs in, so tests would silently
  # accumulate in the half that never runs on PRs. Wall-clock is handled by running this in
  # its own parallel CI job instead, so the cost is max() against mantle-base, not sum().
  #
  # The system package is intentionally absent: it needs a real-CL sysext devnet (Kurtosis or
  # a persistent network) that a PR runner cannot stand up. Run it against a real devnet.
  - id: mantle-elysium
    description: "Mantle Elysium tests for an Arsia L2 consuming a Glamsterdam (Amsterdam) L1."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/beaconslot
        timeout: 1m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/rpcschema
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/rpcheader
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/l2output
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/ethtransferlog
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/evm
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/deposit
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/deposit/consistency
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/activationblock
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/preactivation
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/derivation
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/derivepoch
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/finality
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/headernopollut
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/sequenceractive
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/da/blob
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/da/calldata
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/submission
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/base/epochcross
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/da/cellproof
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/da/channeltimeout
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/da/windowexpiry
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/deposit/crossing
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/reorg
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/reorg/boundaryrestart
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/reorg/consecutive
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/reorg/deep
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/reorg/epoch
        timeout: 10m
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/elysium/reorg/fakepos
        timeout: 10m

  - id: mantle-temp
    description: "Mantle network tests."
    tests:
      - package: github.com/ethereum-optimism/optimism/op-acceptance-tests/mantle-tests/base/deposit
        name: TestDepositMNTByBridge_WithoutMsgValue
        timeout: 5m
